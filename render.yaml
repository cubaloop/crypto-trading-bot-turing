services:
  - type: web
    name: crypto-trading-bot-turing
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    plan: free
    region: frankfurt
    envVars:
      - key: PORT
        value: 10000
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: MODE
        value: paper
      - key: EXCHANGE_ID
        value: kucoin
      - key: SYMBOLS
        value: SOL/USDT,DOGE/USDT,BTC/USDT,ETH/USDT,NEAR/USDT
